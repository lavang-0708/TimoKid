# Integration test trên máy ảo Android, tách riêng khỏi CI chính.
# Chạy khi PR đổi app/lib/** hoặc app/integration_test/**, hoặc khi PR có nhãn "ui".
# Ngân sách: 25 phút.
name: Integration test (máy ảo)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: integration-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    name: Có cần chạy không
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.changes.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            ui:
              - 'app/lib/**'
              - 'app/integration_test/**'

  emulator:
    name: Integration test trên Android API 30
    needs: filter
    if: needs.filter.outputs.ui == 'true' || contains(github.event.pull_request.labels.*.name, 'ui')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Bật KVM cho máy ảo
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      # Build APK test trước khi bật máy ảo, để Gradle không chạy trong lúc máy ảo chờ.
      - name: Build APK cho integration test
        working-directory: app
        run: flutter build apk --debug --target integration_test/app_test.dart

      - name: Cache máy ảo (AVD)
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api30-x86_64-v1

      - name: Tạo AVD và snapshot để cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Đã tạo snapshot AVD."

      - name: Chạy integration test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: app
          script: flutter drive --driver test_driver/integration_test.dart --target integration_test/app_test.dart --use-application-binary build/app/outputs/flutter-apk/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-screenshots
          path: app/integration_test/screenshots/
          if-no-files-found: warn
          retention-days: 14
