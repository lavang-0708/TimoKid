# CI chính: chạy cho mỗi PR vào main và mỗi lần push lên main.
# flutter analyze, flutter test, flutter build apk --debug, đính kèm APK debug.
# Ngân sách: dưới 15 phút.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test và build APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Câu hỏi mẫu (check.py)
        working-directory: .
        run: python3 tools/question_bank/check.py

      - name: Cài Pillow (đọc WebP cho script kiểm tra hình)
        working-directory: .
        run: python3 -m pip install --quiet pillow

      - name: Kiểm tra hình (manifest)
        working-directory: .
        run: python3 tools/assets/check_assets.py

      - name: Test script kiểm tra hình
        working-directory: .
        run: python3 tools/assets/check_assets_test.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: dart format (kiểm tra)
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver

      - name: flutter test
        run: flutter test

      - name: flutter build apk --debug
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: timokid-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
