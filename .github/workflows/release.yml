# Phát hành: khi đẩy tag v* (ví dụ v0.1.0), build APK release đã ký bằng keystore
# từ GitHub Secrets và tạo GitHub Release kèm APK. Thiếu secrets thì dừng, không
# ký bằng debug key. Hướng dẫn chuẩn bị keystore: docs/RELEASE.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build APK release và tạo GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - name: Kiểm tra đủ 4 secrets ký APK
        working-directory: .
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KSP" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KA" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KP" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Thiếu secrets ký APK:$missing. Xem docs/RELEASE.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Cài Pillow (flutter test gọi script kiểm tra hình đọc WebP)
        working-directory: .
        run: python3 -m pip install --quiet pillow

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Tạo keystore và key.properties từ secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > android/app/upload.keystore
          {
            echo "storeFile=upload.keystore"
            echo "storePassword=$KSP"
            echo "keyAlias=$KA"
            echo "keyPassword=$KP"
          } > android/key.properties

      - name: flutter pub get
        run: flutter pub get

      - name: flutter test
        run: flutter test

      # Số phiên bản theo tag: v0.0.18 → tên 0.0.18, mã 18 (= a*10000 +
      # b*100 + c). Mã tăng dần qua từng bản để Android luôn nhận là bản
      # mới khi cài đè (trước đây mọi bản đều mã 1).
      - name: flutter build apk --release
        run: |
          name="${GITHUB_REF_NAME#v}"
          IFS=. read -r a b c <<< "$name"
          code=$(( a * 10000 + b * 100 + c ))
          echo "Phiên bản $name, mã $code"
          # Bản thử (tag v0.0.x): mở hết tính năng + menu QA + tặng xu,
          # kim cương (cờ TEST_UNLOCKS, xem app/lib/core/test_build.dart).
          # Bản chính thức (từ v0.2.0) build không cờ, về luật cũ.
          defines=""
          if [[ "$name" == 0.0.* ]]; then
            defines="--dart-define=TEST_UNLOCKS=true --dart-define=QA_MENU=true"
            echo "Bản thử: $defines"
          fi
          flutter build apk --release --target-platform android-arm64 --build-name="$name" --build-number="$code" $defines

      # Chỉ build cho chip arm64 (gần như mọi máy Android 8 năm gần đây).
      - name: Đổi tên APK theo tag
        run: cp build/app/outputs/flutter-apk/app-release.apk "build/TimoKid-${GITHUB_REF_NAME}.apk"

      - name: Xóa keystore khỏi máy chạy
        if: always()
        working-directory: .
        run: rm -f app/android/app/upload.keystore app/android/key.properties

      - uses: softprops/action-gh-release@v2
        with:
          files: app/build/TimoKid-${{ github.ref_name }}.apk
          generate_release_notes: true
