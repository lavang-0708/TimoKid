# Đoạn step thêm vào .github/workflows/ci.yml, đặt ngay sau step
# "Câu hỏi mẫu (check.py)". Muse KHÔNG đẩy được file workflow qua MCP
# (GitHub App thiếu quyền workflows, trả 403) nên nhờ Claude commit
# giúp bằng git (xem docs/ASSETS.md mục "Nối CI").
#
# Khi step này đã lên CI, test Dart app/test/assets_manifest_test.dart
# vẫn giữ làm kiểm tra dự phòng khi chạy `flutter test` ở local.
      - name: Kiểm tra hình (manifest)
        working-directory: .
        run: python3 tools/assets/check_assets.py

      - name: Test script kiểm tra hình
        working-directory: .
        run: python3 tools/assets/check_assets_test.py
