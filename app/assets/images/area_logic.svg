<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Lâu đài Lôgic: hai tháp + thân lâu đài, tông tím pastel, viền trắng kiểu sticker. -->
  <g stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Cờ trên đỉnh -->
    <line x1="60" y1="44" x2="60" y2="26" stroke="#6C4C8C" stroke-width="3" />
    <path d="M60,26 L78,31 L60,37 Z" fill="#FF8A7A" stroke="none" />
    <!-- Răng tường thân lâu đài -->
    <rect x="42" y="52" width="7" height="8" fill="#C9B8F0" />
    <rect x="52" y="52" width="7" height="8" fill="#C9B8F0" />
    <rect x="62" y="52" width="7" height="8" fill="#C9B8F0" />
    <rect x="72" y="52" width="7" height="8" fill="#C9B8F0" />
    <!-- Thân lâu đài -->
    <rect x="38" y="58" width="44" height="42" rx="6" fill="#C9B8F0" />
    <!-- Răng tường hai tháp -->
    <rect x="22" y="36" width="6" height="8" fill="#A78BDB" />
    <rect x="28" y="36" width="6" height="8" fill="#A78BDB" />
    <rect x="80" y="36" width="6" height="8" fill="#A78BDB" />
    <rect x="86" y="36" width="6" height="8" fill="#A78BDB" />
    <rect x="92" y="36" width="6" height="8" fill="#A78BDB" />
    <!-- Hai tháp -->
    <rect x="22" y="42" width="18" height="58" rx="4" fill="#A78BDB" />
    <rect x="80" y="42" width="18" height="58" rx="4" fill="#A78BDB" />
    <!-- Cửa vòm -->
    <path d="M52,100 L52,88 A8,8 0 0 1 68,88 L68,100 Z" fill="#6C4C8C" />
    <!-- Cửa sổ -->
    <circle cx="31" cy="62" r="4" fill="#FFFFFF" />
    <circle cx="89" cy="62" r="4" fill="#FFFFFF" />
    <circle cx="60" cy="72" r="4" fill="#FFFFFF" />
  </g>
</svg>
