<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Vườn Hình học: hoa có cánh là hình tam giác, vuông, tròn, thoi; tông pastel, viền trắng kiểu sticker. -->
  <g stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Thân + lá -->
    <path d="M60,102 C58,86 62,80 60,68" fill="none" stroke="#7FBF8A" stroke-width="5" />
    <ellipse cx="44" cy="90" rx="12" ry="6" fill="#9ED6A5" transform="rotate(-30 44 90)" />
    <ellipse cx="76" cy="90" rx="12" ry="6" fill="#9ED6A5" transform="rotate(30 76 90)" />
    <!-- Cánh tam giác (trên) -->
    <path d="M60,16 L48,38 L72,38 Z" fill="#F5A9B8" />
    <!-- Cánh vuông (phải) -->
    <rect x="76" y="36" width="20" height="20" rx="4" fill="#BFE0F5" transform="rotate(15 86 46)" />
    <!-- Cánh thoi (dưới) -->
    <path d="M60,80 L72,66 L60,52 L48,66 Z" fill="#BFE8CF" />
    <!-- Cánh tròn (trái) -->
    <circle cx="34" cy="48" r="11" fill="#C9B8F0" />
    <!-- Nhụy -->
    <circle cx="60" cy="48" r="12" fill="#FFD166" />
  </g>
</svg>
