 Ẩn lớp 00 Khung phác trước khi xuất file.</text><text x="60" y="1470" font-size="22" fill="#2f7fd6">Viền đứt nét ngoài cùng là mép an toàn: không vẽ ra ngoài.</text><text x="682" y="486" font-size="20" fill="#2f7fd6">tâm mắt: x = 512 ± 105</text><text x="572" y="582" font-size="20" fill="#2f7fd6">tâm miệng: y = 575</text></g></g>
